<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFX Preview</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1b1b1b; --muted: #666; --card: #fff; --line: #ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #999; --card: #222; --line: #333; }
  }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  p { color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
  .name { flex: 1 1 180px; font-family: ui-monospace, monospace; font-size: 13px; }
  audio { flex: 1 1 260px; max-width: 100%; height: 32px; }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 120px; }
</style>
</head>
<body>
<main>
  <h1>Drifting SFX</h1>
  <p>Generated by sound/gen_sfx.py. Loops play on repeat; the slider changes playback rate to fake RPM / speed.</p>
  <div id="list"></div>
</main>
<script>
  const groups = {
    "Engine (RPM ladder)": ["engine_0900_loop", "engine_1063_loop", "engine_1255_loop", "engine_1482_loop",
                            "engine_1750_loop", "engine_2064_loop", "engine_2436_loop", "engine_2876_loop",
                            "engine_3401_loop", "engine_4009_loop", "engine_4742_loop", "engine_5606_loop",
                            "engine_6615_loop", "engine_7782_loop"],
    "Tyres": ["tire_screech_loop"],
    "Impacts": ["crash_heavy", "crash_light", "cone_hit", "tyre_barrier_hit"],
    "Hazards": ["oil_slip"],
    "Surfaces": ["gravel_loop", "grass_loop", "kerb_rumble_loop"],
    "Race events": ["countdown_beep", "countdown_go", "lap_complete", "finish_line"],
    "UI": ["ui_click", "ui_confirm", "ui_back"],
  };
  const list = document.getElementById("list");
  for (const [title, names] of Object.entries(groups)) {
    const h = document.createElement("h2");
    h.textContent = title;
    list.append(h);
    for (const name of names) {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = name + ".ogg";
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.loop = name.endsWith("_loop");
      audio.src = "../assets/audio/sfx/" + name + ".ogg";
      audio.preservesPitch = false;
      row.append(label, audio);
      if (audio.loop) {
        const rate = document.createElement("label");
        const slider = Object.assign(document.createElement("input"), { type: "range", min: 0.5, max: 2, step: 0.01, value: 1 });
        const out = document.createElement("span");
        out.textContent = "1.00×";
        slider.oninput = () => { audio.playbackRate = +slider.value; out.textContent = (+slider.value).toFixed(2) + "×"; };
        rate.append(slider, out);
        row.append(rate);
      }
      list.append(row);
    }
  }
</script>
</body>
</html>
